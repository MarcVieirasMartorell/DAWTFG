<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="A retro terminal-style RPG where you defend your workstation against malware. Build your party, explore world maps, and fight back." />
<meta name="theme-color" content="#06150c" />
<meta property="og:title" content="DAW — Defending a Workstation" />
<meta property="og:description" content="A retro terminal-style RPG. Defend your workstation, unlock heroes, and clear the network." />
<meta property="og:type" content="website" />
<title>DAW — Defending a Workstation</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" /></noscript>
<link rel="preload" href="/game/styles/daw-battle.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
<link rel="preload" href="/game/styles/daw-profile.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
<link rel="preload" href="/game/styles/daw-shop.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
<link rel="preload" href="/game/styles/daw-devmode.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
<link rel="preload" href="/game/styles/daw-mapshare.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
<style>
  :root{
    /* Default = PHOSPHOR (set via JS) */
    --bg-0:#06150c;
    --bg-1:#0d2818;
    --bg-2:#143a25;
    --fg-dim:#5a8a3a;
    --fg:#a5b985;
    --fg-bright:#d4f4a3;
    --hl:#d4a373;
    --cream:#fefae0;
    --jrpg-blue:#101a6e;
    --jrpg-blue-hi:#3d4ad8;
    --border:#fefae0;
    --shadow:#000;
    /* battle palette */
    --dmg:#ff8a3a; --crit:#ffdc4a; --heal:#a5e58a;
    --block:#9bc4ff; --bad:#ff6ec7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#000;color:var(--fg);
    font-family:'VT323','Courier New',monospace;
    image-rendering:pixelated;-webkit-font-smoothing:none;font-smooth:never}
  body{overflow:hidden}
  /* The CRT shell — full viewport */
  .crt{position:fixed;inset:0;background:var(--bg-0);overflow:hidden}
  .crt::before{ /* scanlines */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.32) 3px, rgba(0,0,0,.32) 3px);
    mix-blend-mode:multiply;opacity:.85;transition:opacity .3s}
  .crt::after{ /* phosphor glow vignette */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:51;
    background:radial-gradient(ellipse at center,
      rgba(255,255,255,0) 50%, rgba(0,0,0,.55) 100%);
    transition:opacity .3s}
  .crt[data-crt="off"]::before{opacity:0}
  .crt[data-crt="off"]::after{opacity:0}
  .crt[data-crt="curve"]{border-radius:32px}
  .crt[data-crt="curve"] .stage{
    transform:perspective(1400px) rotateX(.6deg);
    border-radius:24px;
    box-shadow:
      inset 0 0 80px rgba(0,0,0,.6),
      inset 0 0 6px rgba(255,255,255,.08);
  }

  .stage{position:absolute;inset:0;display:flex;flex-direction:column;
    z-index:1;transition:box-shadow .3s, transform .3s}

  /* Terminal status bar */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:8px 16px;border-bottom:2px solid var(--bg-2);
    font-family:'VT323',monospace;font-size:clamp(14px,1.7vw,20px);color:var(--fg-dim);
    background:linear-gradient(to bottom, var(--bg-1), var(--bg-0));
    flex:0 0 auto;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
  .topbar .path{color:var(--fg);overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  .topbar .right{display:flex;gap:12px;align-items:center;flex:0 0 auto}
  .topbar .path .blink{display:inline-block;width:.45em;height:1em;
    background:var(--fg);vertical-align:-2px;margin-left:4px;
    animation:blink 1.05s steps(2) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  .footer{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:6px 16px;border-top:2px solid var(--bg-2);
    font-family:'VT323',monospace;font-size:clamp(13px,1.5vw,18px);color:var(--fg-dim);
    flex:0 0 auto;letter-spacing:.04em;background:var(--bg-0);
    white-space:nowrap;overflow:hidden}
  .footer>div:last-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .footer .keys{display:flex;gap:18px;flex-wrap:wrap}
  .footer .keys b{color:var(--fg);font-weight:normal}

  /* Main content area — grid so each row claims explicit space */
  .main{flex:1 1 auto;position:relative;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-columns:minmax(0,1fr);
    justify-items:center;
    padding:6px 16px 4px;min-height:0;overflow:hidden}

  /* Boot crawl — absolutely positioned so it overlays the scene without shifting layout */
  .boot{position:absolute;top:0;left:0;right:0;z-index:5;
    font-family:'VT323',monospace;font-size:clamp(13px,1.5vw,18px);color:var(--fg-dim);
    line-height:1.05;letter-spacing:.02em;max-width:1100px;
    white-space:pre-wrap;text-align:left;padding:6px 16px 8px;
    background:linear-gradient(to bottom,var(--bg-0) 70%,transparent 100%)}
  .boot .ok{color:var(--fg-bright)}
  .boot .warn{color:var(--hl)}
  .boot .ln{display:block}

  /* Title */
  .title-wrap{display:flex;flex-direction:column;align-items:center;
    margin:2px 0 0 0;width:100%;flex-shrink:0}
  .title{font-family:'Press Start 2P',monospace;
    font-size:clamp(30px,6.4vw,76px);
    color:var(--fg-bright);
    text-shadow:
      0 4px 0 var(--bg-2),
      0 0 14px color-mix(in srgb, var(--fg-bright) 55%, transparent),
      0 0 38px color-mix(in srgb, var(--fg-bright) 35%, transparent);
    letter-spacing:.02em;line-height:1;
    padding:8px 0;
    opacity:0;transform:translateY(8px);
    transition:opacity .4s, transform .4s}
  .title.in{opacity:1;transform:none;animation:flicker 2.6s steps(1) 1}
  @keyframes flicker{
    0%,100%{opacity:1} 6%{opacity:.2} 8%{opacity:1}
    14%{opacity:.6} 16%{opacity:1} 24%{opacity:.85} 26%{opacity:1}
    38%{opacity:.4} 40%{opacity:1}
  }
  .subtitle{font-family:'Press Start 2P',monospace;
    font-size:clamp(9px,1.25vw,15px);
    color:var(--hl);letter-spacing:.42em;
    margin-top:10px;opacity:0;transition:opacity .6s .8s}
  .subtitle.in{opacity:1}
  .subtitle .pipe{color:var(--fg);margin:0 .9em}

  /* Stage scene */
  .scene-wrap{display:flex;align-items:center;justify-content:center;
    width:100%;min-height:0;min-width:0;margin-top:4px;overflow:hidden}
  .scene{max-width:min(880px,100%);max-height:100%;width:auto;height:100%;display:block}

  /* Menu */
  .menu-wrap{flex:0 0 auto;width:100%;display:flex;justify-content:center;
    margin:6px 0 2px 0}
  .menu{
    width:min(880px, 96%);
    background:var(--jrpg-blue);
    border:4px solid var(--cream);
    box-shadow:
      0 0 0 2px var(--bg-0),
      0 0 0 6px var(--cream),
      0 0 0 8px var(--bg-0),
      0 8px 0 0 rgba(0,0,0,.5);
    padding:14px 20px 12px;position:relative;
    font-family:'Press Start 2P',monospace;
    color:var(--cream);
    opacity:0;transform:translateY(14px);transition:opacity .5s, transform .5s;
  }
  .menu.in{opacity:1;transform:none}
  .menu .legend{display:inline-block;margin:-6px 0 10px;
    background:rgba(0,0,0,.3);
    border:2px solid var(--cream);
    padding:4px 12px;font-size:10px;letter-spacing:.16em;color:var(--cream)}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 22px;margin-top:4px}
  .menu-item{display:flex;align-items:center;gap:10px;
    padding:6px 6px 6px 22px;font-size:clamp(11px,1.15vw,14px);letter-spacing:.04em;
    cursor:default;position:relative;color:var(--cream);
    transition:color .12s, background .12s;}
  .menu-item .cursor{position:absolute;left:0;top:50%;transform:translateY(-52%);
    color:var(--hl);font-size:14px;opacity:0;transition:opacity .08s}
  .menu-item.sel{color:var(--fg-bright);text-shadow:0 0 8px color-mix(in srgb, var(--fg-bright) 40%, transparent)}
  .menu-item.sel .cursor{opacity:1;animation:cursorblink .9s steps(2) infinite}
  @keyframes cursorblink{0%,55%{opacity:1}56%,100%{opacity:.25}}
  .menu-item.disabled{opacity:.45}
  .menu-item .desc{font-family:'VT323',monospace;font-size:14px;
    color:color-mix(in srgb, var(--cream) 55%, transparent);margin-left:6px}
  .menu-item:hover{color:var(--fg-bright)}

  /* Subwindow overlay (e.g. log-in dialog) */
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);z-index:40}
  .dialog{
    width:min(560px,90%);background:var(--jrpg-blue);
    border:4px solid var(--cream);
    box-shadow:0 0 0 2px var(--bg-0),0 0 0 6px var(--cream),
      0 0 0 8px var(--bg-0),0 10px 0 0 rgba(0,0,0,.55);
    padding:22px;color:var(--cream);font-family:'Press Start 2P',monospace}
  .dialog h3{margin:0 0 14px;font-size:14px;letter-spacing:.08em;color:var(--cream)}
  .dialog p{margin:0 0 14px;font-family:'VT323',monospace;font-size:18px;
    color:var(--cream);line-height:1.3}
  .dialog .row{display:flex;gap:10px;margin-top:10px}
  .dialog button{
    appearance:none;border:2px solid var(--cream);background:transparent;
    color:var(--cream);padding:8px 14px;font-family:'Press Start 2P',monospace;
    font-size:11px;letter-spacing:.08em;cursor:default}
  .dialog button:hover, .dialog button.sel{
    background:var(--cream);color:var(--jrpg-blue)}

  /* Sound toggle pill (top-right, in topbar) */
  .sndtoggle{appearance:none;background:transparent;border:1px solid var(--fg-dim);
    color:var(--fg);font-family:'VT323',monospace;font-size:16px;
    padding:2px 8px;cursor:default;letter-spacing:.06em}
  .sndtoggle:hover{border-color:var(--fg);color:var(--fg-bright)}

  /* Shared back-button */
  .daw-back-btn{appearance:none;background:transparent;border:2px solid var(--cream);
    color:var(--cream);font-family:'Press Start 2P',monospace;font-size:9px;
    letter-spacing:.14em;padding:5px 10px;cursor:pointer;flex:0 0 auto;
    transition:background .12s, color .12s, border-color .12s;white-space:nowrap}
  .daw-back-btn:hover{background:var(--hl);color:var(--bg-0);border-color:var(--cream)}
  .daw-back-btn:active{transform:translateY(1px)}

  /* Pixel hero hop */
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .hero-1{animation:hop 1.4s steps(2) infinite}
  .hero-2{animation:hop 1.4s steps(2) infinite .35s}
  .hero-3{animation:hop 1.4s steps(2) infinite .7s}

  /* Sun rising */
  @keyframes sunrise{0%{transform:translateY(28px);opacity:0}100%{transform:translateY(0);opacity:1}}
  .sun{animation:sunrise 2.6s ease-out both .6s}

  /* Star twinkle */
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
  .star{animation:twinkle 2s steps(2) infinite}

  /* Pre-mount fallback splash */
  .fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#5a8a3a;font-family:'VT323',monospace;background:#06150c}

  /* ──────── INTRO ──────── */
  .intro-shell{position:absolute;inset:0;display:flex;flex-direction:column;
    background:var(--bg-0);overflow:hidden;z-index:5}
  /* Phase bar: centred with clamp so it fits all screen sizes.
     left:0/right:0 + justify-content avoids the translateX(-50%) overflow on mobile. */
  .intro-phasebar{position:absolute;top:8px;left:0;right:0;
    display:flex;gap:clamp(8px,2.5vw,18px);justify-content:center;
    font-family:'Press Start 2P',monospace;font-size:clamp(6px,1.8vw,9px);
    letter-spacing:.12em;color:var(--fg-dim);z-index:10;
    padding:0 64px; /* leave room for the SKIP button on the left */
    flex-wrap:wrap}
  .intro-phasebar .pp.on{color:var(--fg-bright);text-shadow:0 0 8px var(--fg-bright)}
  .intro-hint{flex:0 0 auto;text-align:center;padding:8px;font-family:'VT323',monospace;
    font-size:clamp(15px,2.2vw,18px);color:var(--fg-dim);letter-spacing:.04em;z-index:8;
    white-space:normal;word-break:break-word}
  .intro-hint b{color:var(--fg)}

  /* Lore */
  .intro-lore{flex:1 1 auto;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:flex-end}
  .lore-stars{position:absolute;inset:0}
  .lore-star{position:absolute;background:var(--cream);
    animation:twinkle 2.4s steps(2) infinite}
  .lore-crawl{position:absolute;left:0;right:0;bottom:0;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(11px,1.45vw,18px);
    color:var(--fg);text-align:center;line-height:2.2;letter-spacing:.04em;
    padding:0 8%;
    transform:translateY(100%);
    /* Duration is overridden via inline style from JS (responsive per viewport) */
    animation:crawl 28s linear forwards}
  .lore-crawl.snap{animation:none;transform:translateY(-110%);transition:transform .35s}
  .lore-crawl .lore-ln:first-child,
  .lore-crawl .lore-ln:nth-child(2){color:var(--hl)}
  @keyframes crawl{
    0%{transform:translateY(100%)}
    100%{transform:translateY(-120%)}
  }

  /* Dialog */
  .intro-dialog{flex:1 1 auto;position:relative;display:flex;flex-direction:column;
    justify-content:flex-end;padding:36px 12px 8px;overflow:hidden}
  .intro-dialog .scene{position:absolute;left:0;right:0;top:30px;margin:auto;
    width:min(880px,96%);opacity:.7}
  .dlg-row{position:relative;display:flex;gap:14px;align-items:stretch;
    width:min(960px,98%);margin:0 auto;z-index:2}
  .dlg-portrait{display:flex;flex-direction:column;align-items:center;
    flex:0 0 auto}
  .dlg-portrait-frame{
    background:var(--jrpg-blue);border:4px solid var(--cream);
    box-shadow:0 0 0 2px var(--bg-0),0 0 0 6px var(--cream),0 0 0 8px var(--bg-0);
    padding:6px;line-height:0;overflow:hidden}
  .dlg-portrait-frame svg{display:block;max-width:100%;height:auto}
  .dlg-portrait-name{margin-top:10px;font-family:'Press Start 2P',monospace;
    font-size:clamp(7px,1.4vw,9px);color:var(--cream);letter-spacing:.1em;text-align:center;
    text-shadow:0 0 8px color-mix(in srgb, var(--fg-bright) 40%, transparent)}
  .dlg-box{flex:1 1 auto;background:var(--jrpg-blue);border:4px solid var(--cream);
    box-shadow:0 0 0 2px var(--bg-0),0 0 0 6px var(--cream),0 0 0 8px var(--bg-0),
      0 8px 0 0 rgba(0,0,0,.5);
    padding:14px 18px;color:var(--cream);position:relative;min-height:120px;
    display:flex;flex-direction:column;min-width:0}
  .dlg-box .legend{display:inline-block;margin:0 0 8px;
    background:rgba(0,0,0,.3);
    border:2px solid var(--cream);padding:3px 10px;
    font-family:'Press Start 2P',monospace;font-size:clamp(7px,1.4vw,10px);letter-spacing:.14em;color:var(--cream)}
  .dlg-text{font-family:'VT323',monospace;font-size:clamp(16px,2.2vw,24px);
    line-height:1.3;color:var(--cream);letter-spacing:.02em;flex:1 1 auto;
    white-space:pre-wrap;word-break:break-word}
  .dlg-bottom{display:flex;justify-content:space-between;align-items:center;
    margin-top:8px;font-family:'Press Start 2P',monospace;font-size:clamp(7px,1.2vw,9px);
    color:color-mix(in srgb, var(--cream) 60%, transparent);letter-spacing:.1em}
  .dlg-next{opacity:0;transition:opacity .15s;color:var(--hl);font-size:14px}
  .dlg-next.on{opacity:1;animation:cursorblink .9s steps(2) infinite}

  /* Mobile dialog: stack portrait above the text box */
  @media(max-width:520px){
    .intro-dialog{padding:44px 8px 6px}
    .dlg-row{flex-direction:column;gap:8px}
    .dlg-portrait{flex-direction:row;align-items:center;gap:10px}
    .dlg-portrait-frame{flex:0 0 auto}
    .dlg-portrait-frame svg{width:72px !important;height:72px !important}
    .dlg-portrait-name{margin-top:0;text-align:left;font-size:7px}
    .dlg-box{min-height:90px}
  }

  /* Depart */
  .intro-depart{flex:1 1 auto;display:flex;flex-direction:column}
  .depart-stage{flex:1 1 auto;position:relative;display:flex;align-items:center;
    justify-content:center;overflow:hidden}
  .depart-stage .scene{width:min(880px,98%)}
  .depart-overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(12px,3vw,24px);
    background:linear-gradient(to bottom,
      color-mix(in srgb, var(--bg-0) 0%, transparent) 0%, color-mix(in srgb, var(--bg-0) 60%, transparent) 60%, color-mix(in srgb, var(--bg-0) 95%, transparent) 100%);
    font-family:'Press Start 2P',monospace;text-align:center;padding:0 16px}
  .depart-line{font-size:clamp(12px,2.2vw,24px);color:var(--cream);
    letter-spacing:.06em;opacity:0;transform:translateY(8px);
    transition:opacity .5s, transform .5s;
    text-shadow:0 0 12px color-mix(in srgb, var(--fg-bright) 40%, transparent);
    word-break:break-word}
  .depart-line.b{color:var(--fg-bright)}
  .depart-line.c{color:var(--hl)}
  .depart-overlay.step-1 .depart-line.a{opacity:1;transform:none}
  .depart-overlay.step-2 .depart-line.a,
  .depart-overlay.step-2 .depart-line.b{opacity:1;transform:none}
  .depart-overlay.step-3 .depart-line{opacity:1;transform:none}
  .intro-hint .press{
    color:var(--fg-bright);animation:cursorblink 1.1s steps(2) infinite;
    font-family:'Press Start 2P',monospace;font-size:clamp(10px,1.5vw,12px);letter-spacing:.14em}

  /* ──────── WORLD MAP ──────── */
  .map-shell{position:absolute;inset:0;display:flex;flex-direction:column;
    background:var(--bg-0);overflow:hidden;z-index:5}
  .map-topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:8px 16px;border-bottom:2px solid var(--bg-2);
    font-family:'VT323',monospace;font-size:18px;color:var(--fg);
    background:linear-gradient(to bottom,var(--bg-1),var(--bg-0));
    flex:0 0 auto;letter-spacing:.04em;white-space:nowrap;overflow:hidden}

  .map-worlds{flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:6px 16px;background:var(--bg-0);
    border-bottom:2px solid var(--bg-2);
    font-family:'Press Start 2P',monospace;font-size:10px}
  .map-world-btn{appearance:none;cursor:pointer;
    background:rgba(0,0,0,.35);border:2px solid color-mix(in srgb, var(--cream) 30%, transparent);
    color:var(--cream);padding:6px 12px;font:inherit;letter-spacing:.06em;
    display:inline-flex;align-items:center;gap:8px;
    transition:border-color .12s, background .12s, transform .12s}
  .map-world-btn:hover:not(:disabled){border-color:var(--hl);transform:translateY(-1px)}
  .map-world-btn.active{border-color:var(--fg-bright);
    background:var(--jrpg-blue);
    box-shadow:0 0 0 1px var(--fg-bright), 0 0 12px color-mix(in srgb, var(--fg-bright) 30%, transparent)}
  .map-world-btn.locked{opacity:.45;filter:grayscale(.6);
    border-style:dashed;cursor:not-allowed}
  .map-world-btn .num{color:var(--hl);font-size:9px;letter-spacing:.16em}
  .map-world-btn .nm{font-size:10px}
  .map-world-btn .lk{font-size:9px;color:color-mix(in srgb, var(--cream) 50%, transparent);
    font-family:'VT323',monospace}
  .map-world-btn .dot{color:var(--fg-bright);margin-left:2px;font-size:9px}
  .map-worlds-hint{margin-left:auto;color:var(--fg-dim);font-size:9px;
    letter-spacing:.16em}
  .map-bc{color:var(--fg-bright);text-shadow:0 0 8px color-mix(in srgb, var(--fg-bright) 40%, transparent);
    overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  .map-hud{display:flex;gap:14px;align-items:center;font-family:'VT323',monospace;
    color:var(--fg);flex:0 0 auto}
  .map-hud b{color:var(--fg-dim);margin-right:4px}
  .map-stage{flex:1 1 auto;position:relative;display:flex;flex-direction:row;
    gap:0;min-height:0;overflow:hidden;padding-top:18px}
  .map-svg{flex:1 1 auto;width:100%;height:100%;display:block;min-width:0}
  .map-info{flex:0 0 280px;background:var(--jrpg-blue);border-left:4px solid var(--cream);
    padding:14px 18px 16px;color:var(--cream);font-family:'Press Start 2P',monospace;
    font-size:10px;letter-spacing:.06em;position:relative;
    box-shadow:inset 4px 0 0 var(--bg-0)}
  .map-info .legend{display:inline-block;margin:0 0 12px;
    background:rgba(0,0,0,.3);
    border:2px solid var(--cream);padding:4px 12px;
    font-size:10px;letter-spacing:.16em;color:var(--cream)}
  .map-info-row{display:flex;gap:10px;padding:8px 0;
    border-bottom:1px dashed color-mix(in srgb, var(--cream) 25%, transparent);font-size:11px;
    align-items:baseline}
  .map-info-row .lbl{color:color-mix(in srgb, var(--cream) 55%, transparent);width:54px;flex:0 0 auto;font-size:9px}
  .map-info-row span:last-child{font-family:'VT323',monospace;font-size:16px;
    color:var(--cream);letter-spacing:.04em;flex:1 1 auto}
  .map-info-hint{margin-top:14px;font-family:'VT323',monospace;font-size:14px;
    color:color-mix(in srgb, var(--cream) 60%, transparent);letter-spacing:.04em;line-height:1.5}
  .map-info-hint b{color:var(--cream)}
  .map-foot{flex:0 0 auto;padding:6px 16px;border-top:2px solid var(--bg-2);
    background:var(--bg-0);font-family:'VT323',monospace;font-size:14px;color:var(--fg-dim)}
  .map-progress{display:flex;align-items:center;gap:14px;letter-spacing:.04em}
  .map-progress .bar{flex:1 1 auto;height:10px;background:var(--bg-2);
    border:1px solid var(--fg-dim);position:relative;overflow:hidden;
    image-rendering:pixelated}
  .map-progress .fill{height:100%;background:var(--fg-bright);
    transition:width .4s ease-out;
    box-shadow:0 0 8px color-mix(in srgb, var(--fg-bright) 50%, transparent)}

  /* Map zoom wrapper */
  .map-svg-wrap{flex:1 1 auto;position:relative;display:flex;min-width:0;min-height:0}
  .map-svg-outer{flex:1 1 auto;overflow-x:auto;overflow-y:hidden;
    min-width:0;min-height:0}
  .map-svg-inner{height:100%;transition:width .15s ease-out}
  .map-zoom-controls{display:none}
  @media (max-width: 760px){
    .map-zoom-controls{position:absolute;bottom:8px;left:8px;display:flex;
      flex-direction:column;gap:4px;z-index:10}
  }
  .map-zoom-btn{appearance:none;background:var(--jrpg-blue);border:2px solid var(--cream);
    color:var(--cream);font-family:'Press Start 2P',monospace;font-size:14px;
    width:30px;height:30px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s,color .12s}
  .map-zoom-btn:hover{background:var(--cream);color:var(--jrpg-blue)}

  @keyframes spinhalo{to{transform:rotate(360deg)}}
  @keyframes pulsehalo{
    0%{r:14;opacity:.9}
    100%{r:24;opacity:0}
  }

  /* ── Checkpoint / save-node dialogue overlay ── */
  .chkpt-overlay{position:absolute;inset:0;z-index:40;display:flex;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);padding:16px;box-sizing:border-box}
  .chkpt-dialog{background:var(--jrpg-blue);border:4px solid var(--cream);
    box-shadow:0 0 0 2px var(--bg-0),0 0 0 6px var(--cream),0 0 0 8px var(--bg-0);
    max-width:680px;width:100%;display:flex;flex-direction:column;
    max-height:calc(100vh - 40px);overflow:hidden}
  .chkpt-header{padding:6px 14px;border-bottom:2px solid rgba(254,250,224,.18);
    font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:.18em;
    color:var(--hl);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .chkpt-body{display:flex;flex:1 1 auto;min-height:0;cursor:pointer;overflow:hidden}
  .chkpt-portrait-col{flex:0 0 auto;padding:14px 12px;display:flex;flex-direction:column;
    align-items:center;gap:8px;border-right:2px solid rgba(254,250,224,.12);min-width:104px}
  .chkpt-portrait-box{width:80px;height:80px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;border:2px solid rgba(254,250,224,.28);background:rgba(0,0,0,.4);
    overflow:hidden}
  .chkpt-portrait-box img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
  .chkpt-portrait-name{font-family:'Press Start 2P',monospace;font-size:7px;
    color:var(--cream);text-align:center;letter-spacing:.06em;word-break:break-all;max-width:88px}
  .chkpt-text-col{flex:1 1 auto;padding:14px 16px;display:flex;flex-direction:column;
    gap:8px;min-width:0;overflow-y:auto}
  .chkpt-text{font-family:'VT323',monospace;font-size:clamp(17px,2.2vw,22px);
    color:var(--cream);line-height:1.5;letter-spacing:.03em;flex:1 1 auto}
  .chkpt-footer{display:flex;justify-content:space-between;align-items:center;
    padding:7px 14px;border-top:2px solid rgba(254,250,224,.12);flex-shrink:0;
    font-family:'VT323',monospace;font-size:15px;color:rgba(254,250,224,.5);letter-spacing:.04em}
  .chkpt-footer b{color:var(--cream)}
  .chkpt-next{opacity:0;transition:opacity .15s;color:var(--hl);font-size:13px}
  .chkpt-next.on{opacity:1;animation:cursorblink .9s steps(2) infinite}
  .chkpt-reward-phase{padding:20px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .chkpt-reward-title{font-family:'Press Start 2P',monospace;font-size:9px;
    color:var(--hl);letter-spacing:.18em;text-align:center}
  .chkpt-reward-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chkpt-reward-item{background:rgba(212,244,163,.1);border:2px solid var(--fg-bright);
    padding:6px 12px;font-family:'VT323',monospace;font-size:19px;color:var(--fg-bright);
    display:flex;align-items:center;gap:6px;letter-spacing:.04em}
  .chkpt-reward-item .qty{color:var(--hl);font-family:'Press Start 2P',monospace;font-size:8px}
  .chkpt-reward-note{font-family:'VT323',monospace;font-size:17px;
    color:rgba(254,250,224,.55);letter-spacing:.04em;text-align:center}
  .chkpt-continue-btn{appearance:none;background:rgba(212,244,163,.15);
    border:2px solid var(--fg-bright);color:var(--fg-bright);
    font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.1em;
    padding:10px 28px;cursor:pointer;transition:background .12s,color .12s}
  .chkpt-continue-btn:hover{background:var(--fg-bright);color:var(--bg-0)}
  @media(max-width:540px){
    .chkpt-body{flex-direction:column}
    .chkpt-portrait-col{flex-direction:row;border-right:none;
      border-bottom:2px solid rgba(254,250,224,.12);padding:10px 12px;
      min-width:unset;gap:10px;align-items:center}
    .chkpt-portrait-box{width:56px;height:56px}
    .chkpt-portrait-name{max-width:none;font-size:7px}
    .chkpt-dialog{max-height:calc(100vh - 20px)}
  }

  @media (max-width: 760px){
    .map-hud{gap:10px;font-size:14px}
    /* Stack map + info panel vertically; info moves to bottom */
    .map-stage{flex-direction:column}
    .map-svg-outer{flex:1 1 auto;min-height:0}
    /* Info panel: horizontal strip at the bottom */
    .map-info{
      flex:0 0 auto;
      border-left:none;border-top:4px solid var(--cream);
      box-shadow:inset 0 4px 0 var(--bg-0);
      padding:8px 12px;
      display:flex;flex-direction:row;flex-wrap:wrap;
      gap:0 18px;align-items:center;
      overflow:hidden;font-size:9px
    }
    .map-info .legend{flex:0 0 100%;margin:0 0 4px;font-size:9px}
    .map-info-row{flex-direction:row;padding:2px 0;border-bottom:none;gap:5px;flex:0 0 auto}
    .map-info-row .lbl{width:auto}
    .map-info-row span:last-child{font-size:14px}
    .map-info-hint{display:none}
  }

  /* ── Responsive: tablet (561–760px) ── */
  @media (min-width: 561px) and (max-width: 760px){
    .menu-grid{grid-template-columns:1fr 1fr;gap:4px 16px}
    .footer{font-size:11px;padding:4px 10px;gap:8px}
    .footer .keys{gap:10px}
    /* Stacking context so z-index:-1 on scene-wrap is scoped within .main */
    .main{isolation:isolate}
    /* Scene floats as a background layer across all of .main, decoupled from menu size */
    .scene-wrap{
      position:absolute;inset:0;
      z-index:-1;overflow:hidden;pointer-events:none;
      align-items:center;justify-content:center
    }
    /* height:45% of .main keeps scene mid-sized; flex-shrink:0 prevents squeezing */
    .scene{max-width:none;max-height:none;height:45%;width:auto;flex-shrink:0}
  }

  /* ── Responsive: phone (≤560px) ── */
  @media (max-width: 560px){
    /* 3-row grid: title | scene (200px) | menu; center rows so no dead space below */
    .main{grid-template-rows:auto 200px auto;align-content:center;gap:0}
    /* Concrete 200px strip between title and menu.
       overflow:hidden clips the wide SVG sides; justify-content:center (base)
       keeps the center of the scene (heroes+sun) in view. */
    .scene-wrap{height:200px;overflow:hidden;align-items:flex-end;margin:8px 0 6px}
    /* height:100% resolves to 200px; width:auto uses the aspect ratio (~733px wide).
       flex-shrink:0 stops flex from squeezing the SVG back down to container width. */
    .scene{max-width:none;max-height:none;height:100%;width:auto;flex-shrink:0}
    /* Menu: single column, larger touch targets */
    .menu{padding:10px 14px 12px}
    .menu-grid{grid-template-columns:1fr;gap:0}
    .menu-item{font-size:12px;padding:9px 6px 9px 22px;letter-spacing:.03em}
    .menu-item .desc{display:none}
    .menu > div:last-child{display:none}
    .footer{display:none}
  }
</style>
